    <script>
      // Filter out spurious third-party browser extension errors (e.g. Talisman, MetaMask, wallet content scripts)
      (function() {
        function isExtensionError(err, message, file) {
          var msg = (typeof err === 'string' ? err : (err && err.message) || message || '');
          var f = file || (err && err.filename) || '';
          return (
            msg.indexOf('Talisman') !== -1 ||
            msg.indexOf('extension has not been configured') !== -1 ||
            msg.indexOf('injectedWeb3') !== -1 ||
            f.indexOf('chrome-extension://') !== -1 ||
            f.indexOf('moz-extension://') !== -1
          );
        }
        window.addEventListener('error', function(event) {
          if (isExtensionError(event.error, event.message, event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (isExtensionError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
